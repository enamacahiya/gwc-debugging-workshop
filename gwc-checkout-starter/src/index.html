<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Tech Mart | Incident Simulation</title>

  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- JavaScript File -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Navigation Bar -->
  <header class="topbar">
    <div class="brand">
      ✳ Tech Mart
      <span>demo store</span>
    </div>

    <div class="pill">
      🛒 <span id="cart-count">0</span> items
    </div>
  </header>

  <main>

    <!-- Welcome Section -->
    <section class="hero">
      <p class="eyebrow">
        GIRLS WHO CODE · SOFTWARE INCIDENT SIMULATION
      </p>

      <h1>Shop Tech Essentials</h1>
      <p>Desktop Items</p>
    </section>

    <!-- Main Store Layout -->
    <div class="layout">

      <!-- Products Section -->
      <section aria-labelledby="products-heading">
        <h2 id="products-heading">Featured products</h2>

        <!-- Products are generated by JavaScript -->
        <div id="products" class="products"></div>
      </section>

      <!-- Shopping Cart Section -->
      <aside class="cart" aria-labelledby="cart-heading">

        <div class="cart-heading">
          <h2 id="cart-heading">Your cart</h2>
          <span class="cart-caption">Simulated checkout</span>
        </div>

        <!-- Cart items are generated by JavaScript -->
        <div id="cart-items" class="cart-items"></div>

        <!-- Cart Subtotal -->
        <div class="total-line">
          <span>Subtotal</span>
          <strong id="subtotal">$0.00</strong>
        </div>

        <p class="fineprint">
          No real purchases or payments are processed.
        </p>

        <!-- Checkout Button -->
        <button id="checkout-button" class="checkout-button">
          Complete checkout →
        </button>

        <!-- Displays checkout success or error messages -->
        <p
          id="checkout-message"
          class="message"
          role="status"
          aria-live="polite">
        </p>

      </aside>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    Made for Girls Who Code Debugging workshop
  </footer>

</body>
</html>
